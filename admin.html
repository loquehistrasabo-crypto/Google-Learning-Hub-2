<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Google Classroom</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='%2300897b'/><path d='M24 14l-8 8h5v8h6v-8h5z' fill='white'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        .admin-header {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #222;
            border-color: #444;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        .devices-table {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 50px 1fr 200px 150px 150px 120px;
            padding: 16px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #222;
            font-weight: 600;
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .device-row {
            display: grid;
            grid-template-columns: 50px 1fr 200px 150px 150px 120px;
            padding: 16px 20px;
            border-bottom: 1px solid #222;
            align-items: center;
            transition: background 0.2s;
        }

        .device-row:hover {
            background: #1a1a1a;
        }

        .device-row:last-child {
            border-bottom: none;
        }

        .device-icon {
            font-size: 24px;
        }

        .device-id {
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-size: 13px;
        }

        .device-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-idle {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .kick-btn {
            background: #dc2626;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .kick-btn:hover {
            background: #b91c1c;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 18px;
            font-weight: 600;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .bulk-actions {
            display: flex;
            gap: 12px;
        }

        .bulk-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }

        .bulk-btn:hover {
            background: #222;
            border-color: #444;
        }

        .bulk-btn.danger:hover {
            background: #dc2626;
            border-color: #dc2626;
        }

        @media (max-width: 1024px) {
            .table-header, .device-row {
                grid-template-columns: 40px 1fr 120px 100px;
            }
            
            .table-header > :nth-child(4),
            .table-header > :nth-child(5),
            .device-row > :nth-child(4),
            .device-row > :nth-child(5) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="header-left">
            <div class="admin-logo">🛡️</div>
            <h1 class="admin-title">Admin Panel</h1>
        </div>
        <button class="logout-btn" onclick="logout()">← Back to Classroom</button>
    </div>

    <div class="admin-container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Devices</div>
                <div class="stat-value" id="totalDevices">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Online Now</div>
                <div class="stat-value" id="onlineDevices">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Kicked Today</div>
                <div class="stat-value" id="kickedToday">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Sessions</div>
                <div class="stat-value" id="totalSessions">0</div>
            </div>
        </div>

        <div class="actions-bar">
            <h2 class="section-title">Connected Devices</h2>
            <div class="bulk-actions">
                <button class="refresh-btn" onclick="refreshDevices()">🔄 Refresh</button>
                <button class="bulk-btn danger" onclick="kickAll()">⚠️ Kick All</button>
            </div>
        </div>

        <div class="devices-table">
            <div class="table-header">
                <div></div>
                <div>Device ID</div>
                <div>Browser</div>
                <div>Status</div>
                <div>Connected</div>
                <div>Action</div>
            </div>
            <div id="devicesContainer">
                <div class="empty-state">
                    <div class="empty-icon">📱</div>
                    <div class="empty-text">No devices connected</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check admin access
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            alert('Access denied. Admin login required.');
            window.location.href = 'index.html';
        }

        // Device tracking
        let devices = JSON.parse(localStorage.getItem('connectedDevices') || '[]');
        let kickedCount = parseInt(localStorage.getItem('kickedToday') || '0');
        let totalSessions = parseInt(localStorage.getItem('totalSessions') || '0');

        // Initialize
        function init() {
            // Register this session if not admin
            if (!window.location.href.includes('admin.html')) {
                registerDevice();
            }
            
            updateStats();
            renderDevices();
            
            // Auto-refresh every 5 seconds
            setInterval(refreshDevices, 5000);
        }

        function registerDevice() {
            const deviceId = getDeviceId();
            const existingDevice = devices.find(d => d.id === deviceId);
            
            if (!existingDevice) {
                const device = {
                    id: deviceId,
                    browser: getBrowser(),
                    status: 'online',
                    connectedAt: new Date().toISOString(),
                    lastSeen: new Date().toISOString()
                };
                devices.push(device);
                totalSessions++;
                localStorage.setItem('totalSessions', totalSessions);
            } else {
                existingDevice.lastSeen = new Date().toISOString();
                existingDevice.status = 'online';
            }
            
            localStorage.setItem('connectedDevices', JSON.stringify(devices));
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('deviceId');
            if (!deviceId) {
                deviceId = 'device_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                localStorage.setItem('deviceId', deviceId);
            }
            return deviceId;
        }

        function getBrowser() {
            const ua = navigator.userAgent;
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Edge')) return 'Edge';
            return 'Unknown';
        }

        function updateStats() {
            // Clean up old devices (inactive for more than 5 minutes)
            const fiveMinutesAgo = Date.now() - 5 * 60 * 1000;
            devices = devices.filter(d => {
                const lastSeen = new Date(d.lastSeen).getTime();
                return lastSeen > fiveMinutesAgo;
            });
            localStorage.setItem('connectedDevices', JSON.stringify(devices));

            const onlineDevices = devices.filter(d => d.status === 'online').length;
            
            document.getElementById('totalDevices').textContent = devices.length;
            document.getElementById('onlineDevices').textContent = onlineDevices;
            document.getElementById('kickedToday').textContent = kickedCount;
            document.getElementById('totalSessions').textContent = totalSessions;
        }

        function renderDevices() {
            const container = document.getElementById('devicesContainer');
            
            if (devices.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📱</div>
                        <div class="empty-text">No devices connected</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = devices.map(device => {
                const connectedTime = getTimeAgo(device.connectedAt);
                const isOnline = (Date.now() - new Date(device.lastSeen).getTime()) < 60000;
                const status = isOnline ? 'online' : 'idle';
                
                return `
                    <div class="device-row">
                        <div class="device-icon">${getDeviceIcon(device.browser)}</div>
                        <div class="device-id">${device.id}</div>
                        <div>${device.browser}</div>
                        <div><span class="device-status status-${status}">${status.toUpperCase()}</span></div>
                        <div>${connectedTime}</div>
                        <div>
                            <button class="kick-btn" onclick="kickDevice('${device.id}')">Kick</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getDeviceIcon(browser) {
            const icons = {
                'Chrome': '🌐',
                'Firefox': '🦊',
                'Safari': '🧭',
                'Edge': '🔷',
                'Unknown': '📱'
            };
            return icons[browser] || '📱';
        }

        function getTimeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000);
            
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
            return Math.floor(seconds / 86400) + 'd ago';
        }

        function kickDevice(deviceId) {
            if (!confirm('Are you sure you want to kick this device?')) return;
            
            // Mark device as kicked
            localStorage.setItem('kicked_' + deviceId, 'true');
            
            // Remove from devices list
            devices = devices.filter(d => d.id !== deviceId);
            localStorage.setItem('connectedDevices', JSON.stringify(devices));
            
            kickedCount++;
            localStorage.setItem('kickedToday', kickedCount);
            
            updateStats();
            renderDevices();
            
            alert('Device kicked successfully!');
        }

        function kickAll() {
            if (!confirm('Are you sure you want to kick ALL devices? This cannot be undone.')) return;
            
            // Mark all devices as kicked
            devices.forEach(device => {
                localStorage.setItem('kicked_' + device.id, 'true');
            });
            
            kickedCount += devices.length;
            localStorage.setItem('kickedToday', kickedCount);
            
            devices = [];
            localStorage.setItem('connectedDevices', JSON.stringify(devices));
            
            updateStats();
            renderDevices();
            
            alert('All devices kicked successfully!');
        }

        function refreshDevices() {
            devices = JSON.parse(localStorage.getItem('connectedDevices') || '[]');
            updateStats();
            renderDevices();
        }

        function logout() {
            window.location.href = 'index.html';
        }

        // Check if this device is kicked
        function checkIfKicked() {
            const deviceId = getDeviceId();
            if (localStorage.getItem('kicked_' + deviceId) === 'true') {
                alert('You have been kicked by an administrator.');
                localStorage.clear();
                window.location.href = 'https://classroom.google.com';
            }
        }

        // Initialize
        init();
        
        // Check kick status every 2 seconds (for non-admin pages)
        if (!window.location.href.includes('admin.html')) {
            setInterval(checkIfKicked, 2000);
        }
    </script>
</body>
</html>
